name: Test NIMF Firestore authorization rules
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore-access.test.mjs'
      - 'firebase.json'
      - '.github/workflows/test-firestore-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulate-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator and rules testing dependencies
        run: npm install --no-save firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.11.1
      - name: Test access boundaries using Firestore emulator
        run: npx firebase emulators:exec --only firestore --project demo-nimf-access-tests "node tests/firestore-access.test.mjs"
