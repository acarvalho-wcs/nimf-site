name: Publish NIMF public demo
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'secure.html'
      - 'assets/**'
      - 'secure.css'
      - 'secure.js'
      - 'explorer.js'
      - 'explorer-viewport.js'
      - 'intake.js'
      - 'map-points.js'
      - 'record-locale.js'
      - 'language-audit.js'
      - 'scientific-format.js'
      - 'restricted-shell-v3.css'
      - 'firebase-config.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public payload
        shell: bash
        run: |
          set -eu
          node --check app.js
          test -f index.html
          test -f styles.css
          if grep -Ein 'raw.githubusercontent.com/acarvalho-wcs/wildlife-market-intelligence|data/intake/|supabase|service_role' index.html styles.css app.js; then
            echo 'Forbidden private data references' >&2
            exit 1
          fi
          mkdir -p public
          node --check secure.js
          node --check explorer.js
          node --check explorer-viewport.js
          node --test tests/explorer-viewport.test.mjs
          node --check intake.js
          node --check map-points.js
          node --check record-locale.js
          node --check language-audit.js
          node --check scientific-format.js
          test -s restricted-shell-v3.css
          node --check firebase-config.js
          test -f secure.html
          test -f secure.css
          test -f firestore.rules
          grep -q 'allow create, update, delete: if false;' firestore.rules
          cp index.html styles.css app.js secure.html secure.css restricted-shell-v3.css secure.js explorer.js explorer-viewport.js intake.js map-points.js record-locale.js language-audit.js scientific-format.js firebase-config.js public/
          test -f assets/Logo_observat.png
          mkdir -p public/assets
          cp assets/observatory-icon-*.png public/assets/
          cp assets/observatory-safari-20261018.svg public/assets/
          cp assets/Logo_observat.png public/assets/Logo_observat.png
          cp assets/wcs-brasil-institucional.png public/assets/wcs-brasil-institucional.png
          test -s public/assets/wcs-brasil-institucional.png
          test -s public/assets/Logo_observat.png
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
